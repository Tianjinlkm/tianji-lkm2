name: Build TianjiLKM

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KERNEL_BRANCH: pearl-s-oss
      TARGET_RELEASE: 5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284
      KBUILD_BUILD_TIMESTAMP: "Tue Oct 21 03:03:12 UTC 2025"
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu make bc bison flex \
            libssl-dev libelf-dev \
            python3 python-is-python3 cpio kmod xz-utils

      - name: Build
        run: bash "$GITHUB_WORKSPACE/build.sh"

      - name: Upload ko
        uses: actions/upload-artifact@v4
        with:
          name: tianji-lkm-ko
          path: out/*.ko
          if-no-files-found: error
