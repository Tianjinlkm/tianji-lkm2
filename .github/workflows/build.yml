name: Build TianjiLKM
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make bc bison flex libssl-dev
      - name: Clone kernel source
        run: |
          git clone --depth 1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b zircon-t-oss kernel-src
      - name: Fix missing Kconfig files
        run: |
          cd kernel-src
          grep -rh "source \"" drivers/ | sed 's/.*source "//;s/".*//' | grep -v '^$' | while read f; do
            mkdir -p "$(dirname "$f")"
            touch "$f"
          done
      - name: Setup .config and disable stack protector
        run: |
          gunzip -c .config > kernel-src/.config
          cd kernel-src
          sed -i 's/CONFIG_STACKPROTECTOR=y/# CONFIG_STACKPROTECTOR is not set/' .config
          sed -i 's/CONFIG_STACKPROTECTOR_STRONG=y/# CONFIG_STACKPROTECTOR_STRONG is not set/' .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
      - name: Prepare kernel build env
        run: |
          cd kernel-src
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -k modules_prepare -j$(nproc) || true
          mkdir -p arch/arm64/include/generated
          touch arch/arm64/include/generated/cpucaps.h
          touch arch/arm64/include/generated/asm-offsets.h
          mkdir -p arch/arm64/include/generated/uapi/asm
          for f in errno.h ioctl.h ioctls.h ipcbuf.h termbits.h termios.h; do
            touch arch/arm64/include/generated/uapi/asm/$f
          done
          mkdir -p include/generated
          echo '#define UTS_RELEASE "5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284"' > include/generated/utsrelease.h
          touch include/generated/compile.h
      - name: Build module
        run: make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -C kernel-src M=$(pwd) modules
      - name: Upload ko
        uses: actions/upload-artifact@v4
        with:
          name: tianji-lkm-ko
          path: '*.ko'
