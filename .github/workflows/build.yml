name: Build TianjiLKM

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu make bc bison flex \
            libssl-dev libelf-dev \
            python3 python-is-python3 cpio kmod xz-utils
          aarch64-linux-gnu-gcc --version | head -1

      - name: Clone kernel source
        run: |
          git clone --depth 1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b zircon-t-oss kernel-src
          cd kernel-src && git log --oneline -1

      - name: Fix missing Kconfig files
        run: |
          cat > /tmp/fix_kconfig.sh <<'EOS'
          set -x
          cd "$1/kernel-src"
          grep -rh "source \"" --include="Kconfig*" . 2>/dev/null \
            | sed 's/.*source "//; s/".*//' \
            | grep -v '^$' | grep -v '\$' | sort -u > /tmp/srcs.txt
          echo "扫描到 source 条目: $(wc -l < /tmp/srcs.txt)"
          while read -r f; do
            if [ ! -e "$f" ]; then
              mkdir -p "$(dirname "$f")"
              touch "$f"
              echo "补全: $f"
            fi
          done < /tmp/srcs.txt
          EOS
          bash -n /tmp/fix_kconfig.sh
          bash /tmp/fix_kconfig.sh "$GITHUB_WORKSPACE"

      - name: dtc 修复
        run: |
          cat > /tmp/fix_dtc.sh <<'EOS'
          set -x
          cd "$1/kernel-src"
          for f in scripts/dtc/dtc-lexer.l \
                   scripts/dtc/dtc-lexer.lex.c_shipped \
                   scripts/dtc/dtc-lexer.lex.c; do
            [ -f "$f" ] && sed -i '/^YYLTYPE yylloc;$/d' "$f" && echo "已修补 $f"
          done
          printf '\nHOSTCFLAGS += -fcommon\nKBUILD_HOSTCFLAGS += -fcommon\nHOST_EXTRACFLAGS += -fcommon\n' >> Makefile
          EOS
          bash -n /tmp/fix_dtc.sh
          bash /tmp/fix_dtc.sh "$GITHUB_WORKSPACE"

      - name: 准备 .config
        run: |
          cat > /tmp/prep_config.sh <<'EOS'
          set -x
          cd "$1/kernel-src"
          ls -la "$1"
          CFG=""
          for n in .config config config.gz .config.gz; do
            if [ -f "$1/$n" ]; then CFG="$1/$n"; break; fi
          done
          if [ -z "$CFG" ]; then echo "!! 没找到 .config"; exit 1; fi
          echo "使用 config: $CFG"
          if gzip -t "$CFG" 2>/dev/null; then
            gunzip -c "$CFG" > .config
          else
            cp "$CFG" .config
          fi
          echo ".config 行数: $(wc -l < .config)"
          sed -i '/^CONFIG_CC_IS_CLANG=/d; /^CONFIG_CC_VERSION_TEXT=/d' .config
          scripts/config --disable GCC_PLUGINS 2>/dev/null || true
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          echo "--- 关键开关 ---"
          grep -E 'CONFIG_MODVERSIONS=|CONFIG_LOCALVERSION=|CONFIG_SMP=|CONFIG_PREEMPT=|CONFIG_MODULE_UNLOAD=' .config || true
          EOS
          bash -n /tmp/prep_config.sh
          bash /tmp/prep_config.sh "$GITHUB_WORKSPACE"

      - name: modules_prepare（dtc 终极兜底）
        run: |
          cat > /tmp/do_prepare.sh <<'EOS'
          set -x
          cd "$1/kernel-src"
          if make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- V=1 modules_prepare > /tmp/prep.log 2>&1; then
            echo "modules_prepare 一次通过"
          else
            echo "====== 失败，真实错误 ======"
            tail -80 /tmp/prep.log
            echo "====== dtc 换成空壳后重试 ======"
            if [ -d scripts/dtc ]; then
              for f in scripts/dtc/*.c; do
                [ -e "$f" ] || continue
                [ "$(basename "$f")" = "dtc.c" ] && continue
                printf '/* stub */\n' > "$f"
              done
              printf 'int main(int argc, char **argv){(void)argc;(void)argv;return 0;}\n' > scripts/dtc/dtc.c
            fi
            make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          fi
          EOS
          bash -n /tmp/do_prepare.sh
          bash /tmp/do_prepare.sh "$GITHUB_WORKSPACE"

      - name: MODVERSIONS 处理
        run: |
          cat > /tmp/handle_modver.sh <<'EOS'
          set -x
          cd "$1/kernel-src"
          if ! grep -q '^CONFIG_MODVERSIONS=y' .config; then
            echo "MODVERSIONS 未开启，跳过"
            exit 0
          fi
          if [ -s Module.symvers ]; then echo "已有 Module.symvers"; exit 0; fi
          echo "MODVERSIONS=y -> 需要 Module.symvers，尝试编 vmlinux"
          if make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- vmlinux > /tmp/vmlinux.log 2>&1; then
            ls -l Module.symvers && exit 0
          fi
          echo "====== vmlinux 失败 ======"
          tail -40 /tmp/vmlinux.log
          scripts/config --disable MODVERSIONS
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          EOS
          ba
