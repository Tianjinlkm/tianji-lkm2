name: Build TianjiLKM
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make bc bison flex libssl-dev
      - name: Clone kernel source
        run: |
          git clone --depth 1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b zircon-t-oss kernel-src
      - name: Fix missing Kconfig files
        run: |
          cd kernel-src
          grep -rh "source \"" drivers/ | sed 's/.*source "//;s/".*//' | grep -v '^$' | while read f; do
            mkdir -p "$(dirname "$f")"
            touch "$f"
          done
      - name: Setup .config and disable stack protector
        run: |
          gunzip -c .config > kernel-src/.config
          cd kernel-src
          sed -i 's/CONFIG_STACKPROTECTOR=y/# CONFIG_STACKPROTECTOR is not set/' .config
          sed -i 's/CONFIG_STACKPROTECTOR_STRONG=y/# CONFIG_STACKPROTECTOR_STRONG is not set/' .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
      - name: Manually create ALL missing generated headers
        run: |
          cd kernel-src
          mkdir -p arch/arm64/include/generated/uapi/asm
          mkdir -p arch/arm64/include/generated/asm
          mkdir -p include/generated
          
          # 1. Create full cpucaps.h with ALL ARM64 cpu capability macros
          cat > arch/arm64/include/generated/cpucaps.h << 'EOF'
          #ifndef __ASM_CPUCAPS_H
          #define __ASM_CPUCAPS_H
          #define ARM64_HAS_CACHE_IDC		0
          #define ARM64_HAS_CACHE_HW30		1
          #define ARM64_WORKAROUND_CLEAN_CACHE	2
          #define ARM64_WORKAROUND_DEVICE_LOAD_ACQUIRE	3
          #define ARM64_WORKAROUND_834220		4
          #define ARM64_WORKAROUND_843419		5
          #define ARM64_WORKAROUND_1165522		6
          #define ARM64_SPECTRE_V2			7
          #define ARM64_SPECTRE_V3A			8
          #define ARM64_SPECTRE_V4			9
          #define ARM64_MISMATCHED_CACHE_TYPE		10
          #define ARM64_SSB				11
          #define ARM64_SSBD				12
          #define ARM64_MPAM				13
          #define ARM64_KVM_PROTECTED_MODE		14
          #define ARM64_E0PD				15
          #define ARM64_PTR_AUTH			16
          #define ARM64_MTE				17
          #define ARM64_BTI				18
          #define ARM64_GCS				19
          #define ARM64_RAS_EXTN			20
          #define ARM64_NV				21
          #define ARM64_MTE_ASYNC			22
          #define ARM64_EPAN				23
          #define ARM64_SVE				24
          #define ARM64_SME				25
          #define ARM64_SME2				26
          #define ARM64_POE				27
          #define ARM64_CNTVCTSSCT			28
          #define ARM64_CNP				29
          #define ARM64_TLB_RANGE			30
          #define ARM64_HAS_RNG			31
          #define ARM64_WORKAROUND_TSB			32
          #define ARM64_WORKAROUND_SPECULATIVE_SSBS	33
          #define ARM64_WORKAROUND_BHB			34
          #define ARM64_NCAPS			35
          #endif
          EOF
          
          # Put cpucaps.h in all possible locations
          cp arch/arm64/include/generated/cpucaps.h arch/arm64/include/generated/asm/cpucaps.h
          cp arch/arm64/include/generated/cpucaps.h arch/arm64/include/asm/cpucaps.h
          
          # 2. Create bounds.h (empty, just needs to exist)
          touch include/generated/bounds.h
          touch arch/arm64/include/generated/bounds.h
          
          # 3. Create other common generated headers
          touch include/generated/utsrelease.h
          touch include/generated/compile.h
          touch include/generated/autoksyms.h
          touch arch/arm64/include/generated/asm-offsets.h
          touch arch/arm64/include/generated/asm/asm-offsets.h
          
          # 4. Create uapi asm headers
          echo '#include <asm-generic/errno.h>' > arch/arm64/include/generated/uapi/asm/errno.h
          echo '#include <asm-generic/errno-base.h>' > arch/arm64/include/generated/uapi/asm/errno-base.h
          echo '#include <asm-generic/ioctl.h>' > arch/arm64/include/generated/uapi/asm/ioctl.h
          echo '#include <asm-generic/ioctls.h>' > arch/arm64/include/generated/uapi/asm/ioctls.h
          echo '#include <asm-generic/termbits.h>' > arch/arm64/include/generated/uapi/asm/termbits.h
          echo '#include <asm-generic/errno.h>' > arch/arm64/include/generated/uapi/asm/errno.h
      - name: Build module
        run: make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -C kernel-src M=$(pwd) modules
      - name: Upload ko
        uses: actions/upload-artifact@v4
        with:
          name: tianji-lkm-ko
          path: '*.ko'
