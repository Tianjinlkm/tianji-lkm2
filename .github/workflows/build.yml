name: Build TianjiLKM

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            make bc bison flex \
            libssl-dev libelf-dev \
            python3 python-is-python3 cpio kmod xz-utils
          aarch64-linux-gnu-gcc --version | head -1

      - name: Clone kernel source
        run: |
          git clone --depth 1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b zircon-t-oss kernel-src
          cd kernel-src && git log --oneline -1

      - name: Fix dtc link failure on modern GCC
        run: |
          cd kernel-src
          # GCC>=10 默认 -fno-common。5.10 的 dtc 用新版 flex/bison 重新生成后，
          # dtc-lexer.l 与 bison 生成的 parser 各有一份 YYLTYPE yylloc，
          # 链接时报 multiple definition of 'yylloc' -> modules_prepare 中断。
          sed -i '/^YYLTYPE yylloc;$/d' scripts/dtc/dtc-lexer.l
          sed -i '/^YYLTYPE yylloc;$/d' scripts/dtc/dtc-lexer.lex.c_shipped
          # 兜底：宿主程序统一加 -fcommon
          printf '\nHOSTCFLAGS += -fcommon\nKBUILD_HOSTCFLAGS += -fcommon\nHOST_EXTRACFLAGS += -fcommon\n' >> Makefile

      - name: Prepare .config
        run: |
          cd kernel-src
          # 仓库根目录放的是 /proc/config.gz 抓下来的 gzip 文件
          gunzip -c "$GITHUB_WORKSPACE/.config" > .config
          # 这两个是编译时由工具链推导的，设备 config 里带过来会污染 kbuild
          sed -i '/^CONFIG_CC_IS_CLANG=/d; /^CONFIG_CC_VERSION_TEXT=/d' .config
          # 关掉宿主要编 gcc 插件的开关，避免 host 侧再炸一次
          scripts/config --disable GCC_PLUGINS
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          echo "====== vermagic / modversions 相关 ======"
          grep -E 'CONFIG_MODVERSIONS=|CONFIG_MODULE_UNLOAD=|CONFIG_LOCALVERSION=|CONFIG_PREEMPT=|CONFIG_SMP=' .config || true

      - name: modules_prepare (生成全部 generated 头文件)
        run: |
          cd kernel-src
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          echo "====== 自检：关键产物是否齐全 ======"
          ls -l arch/arm64/include/generated/asm/errno.h \
                arch/arm64/include/generated/uapi/asm/errno.h \
                arch/arm64/include/generated/asm/cpucaps.h \
                include/generated/autoconf.h \
                include/generated/bounds.h \
                include/generated/utsrelease.h \
                arch/arm64/include/generated/asm-offsets.h \
                scripts/module.lds

      - name: Build module
        run: |
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               -C "$GITHUB_WORKSPACE/kernel-src" M="$GITHUB_WORKSPACE" modules

      - name: Show module info
        run: |
          for ko in ./*.ko; do
            echo "== $ko =="
            aarch64-linux-gnu-readelf -p .modinfo "$ko" | head -20
          done

      - name: Upload ko
        uses: actions/upload-artifact@v4
        with:
          name: tianji-lkm-ko
          path: '*.ko'
