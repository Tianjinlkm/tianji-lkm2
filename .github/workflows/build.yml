name: Build TianjiLKM

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KERNEL_BRANCH: pearl-s-oss
      TARGET_RELEASE: 5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284
      KBUILD_BUILD_TIMESTAMP: "Tue Oct 21 03:03:12 UTC 2025"
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu make bc bison flex \
            libssl-dev libelf-dev \
            python3 python-is-python3 cpio kmod xz-utils

      # 自动定位 build.sh：根目录优先，找不到就去 .github/workflows/ 里找
      - name: Build
        run: |
          for p in "$GITHUB_WORKSPACE/build.sh" \
                   "$GITHUB_WORKSPACE/.github/workflows/build.sh" \
                   "$GITHUB_WORKSPACE/scripts/build.sh"; do
            if [ -f "$p" ]; then
              echo "找到脚本: $p"
              bash "$p"
              exit 0
            fi
          done
          echo "!! 没找到 build.sh，当前仓库结构如下："
          find "$GITHUB_WORKSPACE" -maxdepth 3 -name '*.sh' -o -maxdepth 3 -name '*.yml' | head -20
          exit 1

      - name: Upload ko
        uses: actions/upload-artifact@v4
        with:
          name: tianji-lkm-ko
          path: out/*.ko
          if-no-files-found: error
