name: Build TianjiLKM
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make bc bison flex libssl-dev device-tree-compiler
      - name: Clone kernel source
        run: |
          git clone --depth 1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b zircon-t-oss kernel-src
      - name: Fix missing Kconfig files
        run: |
          cd kernel-src
          grep -rh "source \"" drivers/ | sed 's/.*source "//;s/".*//' | grep -v '^$' | while read f; do
            mkdir -p "$(dirname "$f")"
            touch "$f"
          done
      - name: Setup .config and disable stack protector
        run: |
          gunzip -c .config > kernel-src/.config
          cd kernel-src
          sed -i 's/CONFIG_STACKPROTECTOR=y/# CONFIG_STACKPROTECTOR is not set/' .config
          sed -i 's/CONFIG_STACKPROTECTOR_STRONG=y/# CONFIG_STACKPROTECTOR_STRONG is not set/' .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
      - name: Replace dtc with real system binary
        run: |
          cd kernel-src
          sudo cp /usr/bin/dtc scripts/dtc/dtc
          sudo chmod 755 scripts/dtc/dtc
          find scripts/dtc -name "*.c" -exec sudo touch -t 202001010000 {} \;
          find scripts/dtc -name "*.o" -exec sudo touch -t 202001010000 {} \;
      - name: Prepare kernel build env
        run: |
          cd kernel-src
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc) || true
      - name: Build module
        run: make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -C kernel-src M=$(pwd) modules
      - name: Upload ko
        uses: actions/upload-artifact@v4
        with:
          name: tianji-lkm-ko
          path: '*.ko'
