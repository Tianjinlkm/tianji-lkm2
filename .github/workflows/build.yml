name: Build TianjiLKM

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            make bc bison flex \
            libssl-dev libelf-dev \
            python3 python-is-python3 cpio kmod xz-utils
          aarch64-linux-gnu-gcc --version | head -1
          flex --version
          bison --version | head -1

      - name: Clone kernel source
        run: |
          git clone --depth 1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b zircon-t-oss kernel-src
          cd kernel-src && git log --oneline -1

      - name: Fix missing Kconfig files (全树扫描，只补缺失)
        run: |
          cd kernel-src
          # Xiaomi OSS 分支常删掉闭源驱动目录（如 drivers/misc/hwid），
          # 但父 Kconfig 仍保留 source "..." 行 -> olddefconfig 报 "can't open file" 并退出。
          # 扫描全树，为所有缺失的 source 目标创建空 Kconfig。
          # touch 对已存在文件只改时间戳、不破坏内容，所以是安全的。
          grep -rh "source \"" --include="Kconfig*" . 2>/dev/null \
            | sed 's/.*source "//;s/".*//' \
            | grep -v '^$' | grep -v '\$' | sort -u \
            | while read -r f; do
                if [ ! -e "$f" ]; then
                  mkdir -p "$(dirname "$f")"
                  touch "$f"
                  echo "补全缺失 Kconfig: $f"
                fi
              done
          echo "====== 关键点自检 ======"
          ls -l drivers/misc/hwid/Kconfig 2>/dev/null || echo "(hwid/Kconfig 仍缺失!)"

      - name: dtc 修复（容错：文件不存在也绝不中断）
        run: |
          cd kernel-src
          echo "====== scripts/dtc 实际内容 ======"
          ls -l scripts/dtc/ 2>/dev/null || echo "(scripts/dtc 目录不存在)"
          echo "====== kernel 版本 ======"
          head -5 Makefile

          # GCC>=10 默认 -fno-common。5.10 的 dtc 在新版 flex/bison 下
          # lexer 与 parser 各有一份 YYLTYPE yylloc -> multiple definition -> 链接失败
          for f in scripts/dtc/dtc-lexer.l \
                   scripts/dtc/dtc-lexer.lex.c_shipped \
                   scripts/dtc/dtc-lexer.lex.c ; do
            if [ -f "$f" ]; then
              sed -i '/^YYLTYPE yylloc;$/d' "$f"
              echo "已修补: $f"
            else
              echo "跳过（不存在）: $f"
            fi
          done

          # 兜底：所有 host 程序统一 -fcommon
          printf '\nHOSTCFLAGS += -fcommon\nKBUILD_HOSTCFLAGS += -fcommon\nHOST_EXTRACFLAGS += -fcommon\n' >> Makefile

      - name: 定位并准备 .config（多级兜底）
        run: |
          cd kernel-src
          echo "====== 工作区根目录 ======"
          ls -la "$GITHUB_WORKSPACE"

          CFG=""
          for p in "$GITHUB_WORKSPACE/.config" \
                   "$GITHUB_WORKSPACE/config" \
                   "$GITHUB_WORKSPACE/config.gz" \
                   "$GITHUB_WORKSPACE/.config.gz" \
                   "$GITHUB_WORKSPACE/config_device" \
                   "$GITHUB_WORKSPACE/config_device.h" ; do
            if [ -f "$p" ]; then CFG="$p"; break; fi
          done

          if [ -n "$CFG" ]; then
            echo "候选 config 文件: $CFG"
            # 用魔数判断是否 gzip（1f 8b）
            if head -c2 "$CFG" | od -An -tx1 | grep -q '1f 8b'; then
              echo "检测到 gzip，解压"
              gunzip -c "$CFG" > .config
            else
              echo "纯文本，直接复制"
              cp "$CFG" .config
            fi

            # 若不是 kconfig 格式（例如 #define CONFIG_X 1），做转换
            if ! grep -q '^CONFIG_[A-Za-z0-9_]*=[ym]' .config; then
              echo "====== 非 kconfig 格式，#define -> CONFIG_X=... 转换 ======"
              awk '/^[[:space:]]*#define[[:space:]]+CONFIG_/ {
                     sub(/^[[:space:]]*#define[[:space:]]+/, "");
                     if ($0 ~ /[ \t]/) sub(/[ \t]+/, "="); else $0 = $0 "=y";
                     print
                   }' "$CFG" > .config.kcfg
              grep '^CONFIG_' .config.kcfg > .config
              rm -f .config.kcfg
            fi

            LINES=$(wc -l < .config)
            echo "转换后 .config 行数: $LINES"
            if [ "$LINES" -lt 50 ]; then
              echo "!! config 内容过少（视为无效），改用源码自带 defconfig"
              CFG=""
            elif [ "$LINES" -lt 2000 ]; then
              echo "警告: .config 仅 $LINES 行，可能只是片段而非完整设备配置"
            fi
          fi

          if [ -z "$CFG" ]; then
            echo "====== 无可用 config，回退源码自带 defconfig ======"
            ls arch/arm64/configs/ 2>/dev/null | head -40
            ls arch/arm64/configs/vendor/ 2>/dev/null | head -40
            DEF=$(ls arch/arm64/configs/ arch/arm64/configs/vendor/ 2>/dev/null \
                  | grep -iE 'zircon|pearl|mt6896' | head -1)
            if [ -n "$DEF" ]; then
              echo "选用 defconfig: $DEF"
              cp "arch/arm64/configs/$DEF" .config 2>/dev/null \
                || cp "arch/arm64/configs/vendor/$DEF" .config
            else
              echo "无匹配 defconfig，使用默认 defconfig"
              make A
