name: Build TianjiLKM

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            make bc bison flex \
            libssl-dev libelf-dev \
            python3 python-is-python3 cpio kmod xz-utils
          aarch64-linux-gnu-gcc --version | head -1
          flex --version
          bison --version | head -1

      - name: Clone kernel source
        run: |
          git clone --depth 1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b zircon-t-oss kernel-src
          cd kernel-src && git log --oneline -1

      - name: dtc 修复（容错版：文件不存在也绝不中断）
        run: |
          cd kernel-src
          echo "====== scripts/dtc 实际内容 ======"
          ls -l scripts/dtc/ 2>/dev/null || echo "(scripts/dtc 目录不存在)"
          echo "====== kernel 版本 ======"
          head -5 Makefile

          # GCC>=10 默认 -fno-common。5.10 的 dtc 在新版 flex/bison 下
          # lexer 与 parser 各有一份 YYLTYPE yylloc -> multiple definition -> 链接失败
          # 1) 删掉重复的 yylloc 定义（只对存在的文件动手）
          for f in scripts/dtc/dtc-lexer.l \
                   scripts/dtc/dtc-lexer.lex.c_shipped \
                   scripts/dtc/dtc-lexer.lex.c ; do
            if [ -f "$f" ]; then
              sed -i '/^YYLTYPE yylloc;$/d' "$f"
              echo "已修补: $f"
            else
              echo "跳过（不存在）: $f"
            fi
          done

          # 2) 兜底：所有 host 程序统一 -fcommon，直接化解 yylloc 重复定义
          printf '\nHOSTCFLAGS += -fcommon\nKBUILD_HOSTCFLAGS += -fcommon\nHOST_EXTRACFLAGS += -fcommon\n' >> Makefile

      - name: Prepare .config
        run: |
          cd kernel-src
          gunzip -c "$GITHUB_WORKSPACE/.config" > .config
          sed -i '/^CONFIG_CC_IS_CLANG=/d; /^CONFIG_CC_VERSION_TEXT=/d' .config
          scripts/config --disable GCC_PLUGINS
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          echo "====== 关键开关 ======"
          grep -E 'CONFIG_MODVERSIONS=|CONFIG_LOCALVERSION=|CONFIG_CC_IS_' .config || true

      - name: modules_prepare（带 dtc 终极兜底）
        run: |
          cd kernel-src
          if ! make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- V=1 modules_prepare > /tmp/prep.log 2>&1; then
            echo "====== modules_prepare 失败，打印真实错误 ======"
            tail -60 /tmp/prep.log
            echo "====== 启用 dtc 兜底：替换为可编译的 stub ======"
            if [ -d scripts/dtc ]; then
              for f in scripts/dtc/*.c; do
                [ -e "$f" ] || continue
                [ "$(basename "$f")" = "dtc.c" ] && continue
                printf '/* stub */\n' > "$f"
              done
              printf 'int main(int argc, char **argv){(void)argc;(void)argv;return 0;}\n' > scripts/dtc/dtc.c
            fi
            make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          else
            echo "====== modules_prepare 一次通过 ======"
          fi

      - name: 自检产物
        run: |
          cd kernel-src
          ls -l arch/arm64/include/generated/asm/errno.h \
                arch/arm64/include/generated/uapi/asm/errno.h \
                arch/arm64/include/generated/asm/cpucaps.h \
                include/generated/autoconf.h \
                include/generated/bounds.h \
                include/generated/utsrelease.h \
                arch/arm64/include/generated/asm-offsets.h \
                scripts/module.lds
          echo "====== Module.symvers ======"
          ls -l Module.symvers 2>/dev/null || echo "(无 Module.symvers，CONFIG_MODVERSIONS 可能未开)"

      - name: Build module
        run: |
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               -C "$GITHUB_WORKSPACE/kernel-src" M="$GITHUB_WORKSPACE" modules

      - name: Show module info
        run: |
          for ko in ./*.ko; do
            echo "== $ko =="
            aarch64-linux-gnu-readelf -p .modinfo "$ko" | head -20
          done

      - name: Upload ko
        uses: actions/upload-artifact@v4
        with:
          name: tianji-lkm-ko
          path: '*.ko'
