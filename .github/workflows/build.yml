name: Build TianjiLKM

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KERNEL_BRANCH: pearl-s-oss
      TARGET_RELEASE: 5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284
      KBUILD_BUILD_TIMESTAMP: "Tue Oct 21 03:03:12 UTC 2025"
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu make bc bison flex \
            libssl-dev libelf-dev \
            python3 python-is-python3 cpio kmod xz-utils

      # 先体检脚本：不完整就立刻说清楚，不让它跑一半抛莫名错误
      - name: 检查 build.sh 完整性
        run: |
          for p in "$GITHUB_WORKSPACE/build.sh" \
                   "$GITHUB_WORKSPACE/.github/workflows/build.sh"; do
            if [ -f "$p" ]; then S="$p"; break; fi
          done
          if [ -z "${S:-}" ]; then
            echo "!! 没找到 build.sh"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -name '*.sh' | head
            exit 1
          fi
          echo "路径: $S"
          echo "行数: $(wc -l < "$S")  字节: $(wc -c < "$S")"
          echo "首行: $(head -1 "$S")"
          echo "末行: $(tail -1 "$S")"
          if ! tail -1 "$S" | grep -q 'BUILD-SH-END-MARKER'; then
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "!! build.sh 不完整 —— 上传时被截断了"
            echo "!! 正确版本共 69 行、6115 字节，末行是 # BUILD-SH-END-MARKER"
            echo "!! 请用 Add file -> Upload files 重传，不要用粘贴"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            exit 1
          fi
          if ! bash -n "$S"; then
            echo "!! 语法检查未通过"
            exit 1
          fi
          echo "==> 脚本完整且语法正确"

      - name: Build
        run: |
          for p in "$GITHUB_WORKSPACE/build.sh" \
                   "$GITHUB_WORKSPACE/.github/workflows/build.sh"; do
            if [ -f "$p" ]; then bash "$p"; exit 0; fi
          done

      - name: Upload ko
        uses: actions/upload-artifact@v4
        with:
          name: tianji-lkm-ko
          path: out/*.ko
          if-no-files-found: error
