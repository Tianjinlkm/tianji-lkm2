name: Build TianjiLKM
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make bc bison flex libssl-dev

      - name: Clone pearl kernel source
        run: |
          git clone --depth 1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b zircon-t-oss kernel-src

      - name: Unpack real .config from phone
        run: |
          gunzip -c config > kernel-src/.config
          cd kernel-src
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Prepare kernel build env
        run: |
          cd kernel-src
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc)

      - name: Build TianjiLKM
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -C kernel-src M=$(pwd) modules

      - name: Upload ko
        uses: actions/upload-artifact@v4
        with:
          name: tianji-lkm-ko
          path: '*.ko'
